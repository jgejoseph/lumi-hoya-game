<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumi & Hoya 的貓咪日常</title>
<style>
:root{
  --bg:#fff8ea; --card:#ffffffdd; --text:#3b312b; --muted:#7b716c;
  --amber:#e6a52f; --amber2:#b96e00; --border:#f0dfbd;
  --green:#4fb78a; --pink:#ef7fa4; --blue:#63b9db;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
body{min-height:100vh}
button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(#fffaf0,#fff6e4)}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fffffff2;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.id{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{font-size:34px}
.name{font-weight:800;font-size:20px;line-height:1.1}
.breed{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.top-actions{display:flex;align-items:center;gap:8px}
.coin{background:#fff0c6;padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:750;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--amber);color:white}
.btn-secondary{background:#eee8df;color:var(--text)}
main{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column}
.stats{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:0 4px 18px #8c5b1320}
.stat{margin:8px 0}
.statline{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.track{height:10px;background:#e8e2d8;border-radius:999px;overflow:hidden}
.bar{height:100%;border-radius:999px;transition:width .25s ease}
#bar-hunger{background:var(--green)} #bar-happy{background:var(--pink)} #bar-clean{background:var(--blue)}
.cat-stage{flex:1;min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center}
.cat-wrap{user-select:none;cursor:pointer}
.cat-emoji{font-size:120px;filter:drop-shadow(0 10px 10px #7d5d2d22);animation:float 3s ease-in-out infinite}
.dialogue{display:inline-block;margin-top:8px;padding:9px 14px;background:#fffffff0;border:1px solid var(--border);border-radius:999px;font-size:14px;font-weight:800}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 8px 14px;background:#fffffff2;border-top:1px solid var(--border)}
.navbtn{border:0;background:transparent;border-radius:14px;padding:8px 2px;min-height:58px;color:var(--text)}
.navbtn:active{background:#fff0d7}
.navicon{display:block;font-size:23px;line-height:1.1}.navtxt{display:block;font-size:11px;margin-top:4px;font-weight:750}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:#0008}
.modal.show{display:flex}
.sheet{width:min(92vw,390px);background:white;border-radius:24px;padding:18px;box-shadow:0 20px 50px #0004}
.sheet h2{margin:0 0 4px}.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.arena{position:relative;height:270px;background:#fff8e8;border:2px dashed #edcf96;border-radius:18px;overflow:hidden}
.target{position:absolute;font-size:44px;display:none;cursor:pointer;user-select:none;transition:transform .08s}
.prompt{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:800;color:var(--amber2)}
.sheet-actions{display:flex;gap:8px;margin-top:12px}.sheet-actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:#312820;color:white;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.cat-emoji{animation:none}.bar{transition:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="id">
    <div id="header-avatar" class="avatar">😺</div>
    <div style="min-width:0">
      <div id="header-name" class="name">Lumi</div>
      <div id="header-breed" class="breed">重點色布偶貓</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="coin">💰 <span id="coin-count">150</span></div>
    <button id="switch-btn" class="btn btn-primary" type="button">切換</button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat"><div class="statline"><span>🐟 飽足感</span><span id="stat-hunger">80%</span></div><div class="track"><div id="bar-hunger" class="bar" style="width:80%"></div></div></div>
    <div class="stat"><div class="statline"><span>💖 心情</span><span id="stat-happy">85%</span></div><div class="track"><div id="bar-happy" class="bar" style="width:85%"></div></div></div>
    <div class="stat"><div class="statline"><span>✨ 清潔度</span><span id="stat-clean">90%</span></div><div class="track"><div id="bar-clean" class="bar" style="width:90%"></div></div></div>
  </section>

  <section class="cat-stage">
    <div id="cat-wrap" class="cat-wrap" role="button" tabindex="0" aria-label="摸摸目前的貓咪">
      <div id="cat-emoji" class="cat-emoji">😺</div>
      <div id="cat-dialogue" class="dialogue">喵～摸摸我！</div>
    </div>
  </section>
</main>

<nav>
  <button id="feed-btn" class="navbtn" type="button"><span class="navicon">🐟</span><span class="navtxt">餵食</span></button>
  <button id="play-btn" class="navbtn" type="button"><span class="navicon">🧶</span><span class="navtxt">玩耍</span></button>
  <button id="clean-btn" class="navbtn" type="button"><span class="navicon">🛁</span><span class="navtxt">梳毛</span></button>
  <button id="game-btn" class="navbtn" type="button"><span class="navicon">🎮</span><span class="navtxt">小遊戲</span></button>
  <button id="shop-btn" class="navbtn" type="button"><span class="navicon">🛒</span><span class="navtxt">商店</span></button>
</nav>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="sheet">
    <h2>🎮 接肉泥大作戰！</h2>
    <p>10 秒內一直點肉泥，接到越多賺越多金幣。</p>
    <div id="arena" class="arena">
      <div id="target" class="target">🥫</div>
      <div id="prompt" class="prompt">準備好了就按「開始遊戲」</div>
    </div>
    <div class="sheet-actions">
      <button id="start-game" class="btn btn-primary" type="button">開始遊戲</button>
      <button id="close-game" class="btn btn-secondary" type="button">關閉</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script>
(() => {
  const cats = {
    lumi:{name:"Lumi",breed:"重點色布偶貓・藍眼優雅",avatar:"😺",hunger:80,happy:85,clean:90,dialogue:["喵嗚～摸摸我的下巴","呼嚕嚕…好舒服","主人要陪我玩嗎？"]},
    hoya:{name:"Hoya",breed:"金漸層英短・圓滾好奇",avatar:"😸",hunger:75,happy:90,clean:85,dialogue:["喵！Hoya 想吃肉泥","呼嚕呼嚕…踩奶中","有罐罐嗎？"]}
  };
  let key="lumi", coins=150, timer=null, score=0, remaining=0;
  const $=id=>document.getElementById(id);
  const clamp=v=>Math.max(0,Math.min(100,v));

  function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1200)}
  function dialogue(msg){$("cat-dialogue").textContent=msg}
  function render(){
    const c=cats[key];
    $("header-avatar").textContent=c.avatar;
    $("header-name").textContent=c.name;
    $("header-breed").textContent=c.breed;
    $("cat-emoji").textContent=c.avatar;
    $("coin-count").textContent=coins;
    [["hunger",c.hunger],["happy",c.happy],["clean",c.clean]].forEach(([n,v])=>{
      $("stat-"+n).textContent=v+"%"; $("bar-"+n).style.width=v+"%";
    });
  }
  function pet(){const c=cats[key];c.happy=clamp(c.happy+5);dialogue(c.dialogue[Math.floor(Math.random()*c.dialogue.length)]);render()}
  function switchCat(){key=key==="lumi"?"hoya":"lumi";dialogue("換我囉！我是 "+cats[key].name);render()}
  function feed(){const c=cats[key];if(coins<10){toast("金幣不足，先去玩小遊戲！");return}coins-=10;c.hunger=clamp(c.hunger+25);dialogue("一口接一口，好好吃！😋");render()}
  function play(){const c=cats[key];c.happy=clamp(c.happy+20);c.hunger=clamp(c.hunger-10);dialogue("抓到了！✨");render()}
  function clean(){const c=cats[key];c.clean=clamp(c.clean+25);dialogue("梳梳毛，好舒服～");render()}
  function openGame(){$("modal").classList.add("show");$("modal").setAttribute("aria-hidden","false")}
  function stopGame(){
    if(timer){clearInterval(timer);timer=null}
    $("target").style.display="none";
  }
  function closeGame(){stopGame();$("modal").classList.remove("show");$("modal").setAttribute("aria-hidden","true")}
  function moveTarget(){
    const a=$("arena"), t=$("target");
    const maxX=Math.max(0,a.clientWidth-t.offsetWidth-8), maxY=Math.max(0,a.clientHeight-t.offsetHeight-8);
    t.style.left=(4+Math.random()*maxX)+"px";t.style.top=(4+Math.random()*maxY)+"px";
  }
  function startGame(){
    stopGame();score=0;remaining=10;
    $("prompt").textContent="快點肉泥！剩下 10 秒";
    $("target").style.display="block";moveTarget();
    timer=setInterval(()=>{
      remaining--;
      $("prompt").textContent="快點肉泥！剩下 "+remaining+" 秒";
      moveTarget();
      if(remaining<=0){
        stopGame();coins+=score*10;render();
        $("prompt").textContent="遊戲結束！接到 "+score+" 個，獲得 "+(score*10)+" 金幣";
      }
    },1000);
  }
  function catchItem(){if(!timer)return;score++;$("target").style.transform="scale(1.25)";setTimeout(()=>$("target").style.transform="scale(1)",80);moveTarget()}
  function shop(){
    if(coins<30){toast("需要 30 金幣");return}
    if(confirm("花 30 金幣買高級罐頭給兩隻一起吃？")){
      coins-=30;
      Object.values(cats).forEach(c=>{c.hunger=clamp(c.hunger+40);c.happy=clamp(c.happy+8)});
      dialogue("今天吃高級罐罐！😻");render();
    }
  }

  $("switch-btn").addEventListener("click",switchCat);
  $("cat-wrap").addEventListener("click",pet);
  $("cat-wrap").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pet()}});
  $("feed-btn").addEventListener("click",feed);
  $("play-btn").addEventListener("click",play);
  $("clean-btn").addEventListener("click",clean);
  $("game-btn").addEventListener("click",openGame);
  $("shop-btn").addEventListener("click",shop);
  $("start-game").addEventListener("click",startGame);
  $("close-game").addEventListener("click",closeGame);
  $("target").addEventListener("click",catchItem);
  $("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeGame()});
  render();
})();
</script>
</body>
</html>
