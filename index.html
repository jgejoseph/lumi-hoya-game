<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#151821" />
<title>Lumi & Hoya Pixel Room</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#101218;color:#f6f0e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit}.app{max-width:520px;margin:auto;min-height:100vh;background:#151821;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid #ffffff14}.who{display:flex;gap:9px;align-items:center}.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#6d554c;font-weight:900}.name{font-weight:900;font-size:18px}.sub{font-size:11px;color:#bbb2aa;margin-top:3px}.r{display:flex;gap:7px;align-items:center}.pill,.icon{background:#242836;border:1px solid #ffffff18;border-radius:12px}.pill{padding:8px 10px;font-size:12px;font-weight:800}.icon{width:38px;height:38px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.stat{padding:7px;background:#202431;border:1px solid #ffffff12;border-radius:12px}.sl{display:flex;justify-content:space-between;font-size:10px;color:#c9c0b8}.meter{height:5px;background:#0f1118;border-radius:8px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;border-radius:8px}.scene{position:relative;flex:1;min-height:520px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.note{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:88%;padding:8px 11px;border-radius:999px;background:#0c0f15d8;border:1px solid #ffffff1c;font-size:12px;font-weight:800;opacity:0;transition:.18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note.show{opacity:1}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px 10px 12px;border-top:1px solid #ffffff14}.tool{min-height:60px;background:#202431;border:1px solid #ffffff16;border-radius:14px}.tool:active{transform:scale(.98)}.tool b{display:block;font-size:23px}.tool span{display:block;font-size:11px;margin-top:3px}.drawer{position:absolute;left:10px;right:10px;bottom:80px;background:#171a23ee;border:1px solid #ffffff1c;border-radius:17px;padding:11px;display:none;z-index:20}.drawer.show{display:block}.drawerhead{display:flex;justify-content:space-between;font-size:12px;color:#c7bdb6}.drawerhead button{border:0;background:none;color:#c7bdb6}.items{display:flex;gap:9px;margin-top:9px}.item{width:76px;height:72px;border-radius:14px;background:#252a38;border:1px solid #ffffff17;display:grid;place-items:center;user-select:none;touch-action:none;text-align:center}.item b{font-size:27px}.item small{display:block;font-size:10px;color:#c7bdb6}.closeup{position:absolute;inset:0;z-index:30;background:linear-gradient(#2c2536,#171821);display:none;align-items:center;justify-content:center;flex-direction:column;touch-action:none}.closeup.show{display:flex}.closeup h3{margin:0 0 4px}.closeup p{margin:0 0 10px;color:#c9c0b8;font-size:12px}.closeup canvas{width:min(92vw,450px);height:min(92vw,450px);max-height:450px;border-radius:24px;background:#211d28;border:1px solid #ffffff18}.back{margin-top:10px;background:#272c3a;border:1px solid #ffffff18;border-radius:12px;padding:9px 13px;font-weight:800}.fx{position:absolute;inset:0;pointer-events:none}.heart{position:absolute;font-size:22px;animation:rise .95s ease-out forwards}@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}.start{position:absolute;inset:0;z-index:60;background:#0d0f15f2;display:grid;place-items:center;padding:24px;text-align:center}.start h2{margin:0 0 8px}.start p{font-size:13px;color:#c8beb6;line-height:1.55;max-width:350px}.start button{border:0;border-radius:14px;padding:12px 18px;background:#f1b95f;color:#2c2217;font-weight:900}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#050609e8;border:1px solid #ffffff20;border-radius:999px;padding:9px 13px;font-size:12px;opacity:0;transition:.2s;z-index:100}.toast.show{opacity:1}@media(max-width:380px){.sub{display:none}.stat{padding:6px}.pill{padding:7px 8px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="who"><div id="badge" class="badge">L</div><div><div id="name" class="name">Lumi</div><div id="sub" class="sub">重點色布偶貓 · 溫柔黏人</div></div></div><div class="r"><div class="pill">💰 <span id="coins">150</span></div><button id="music" class="icon" type="button">♫</button><button id="switch" class="icon" type="button">⇄</button></div></div>
<div class="stats">
<div class="stat"><div class="sl"><span>飽足</span><b id="ht">82</b></div><div class="meter"><i id="hb" style="width:82%;background:#7fd0a2"></i></div></div>
<div class="stat"><div class="sl"><span>心情</span><b id="mt">88</b></div><div class="meter"><i id="mb" style="width:88%;background:#ef8fa9"></i></div></div>
<div class="stat"><div class="sl"><span>精力</span><b id="et">76</b></div><div class="meter"><i id="eb" style="width:76%;background:#79bce8"></i></div></div>
<div class="stat"><div class="sl"><span>親密</span><b id="bt">40</b></div><div class="meter"><i id="bb" style="width:40%;background:#f4bd62"></i></div></div>
</div>
<div id="scene" class="scene">
<canvas id="room"></canvas><div id="note" class="note"></div>
<div id="drawer" class="drawer"><div class="drawerhead"><span id="drawerTitle">拖曳道具</span><button id="closeDrawer">關閉</button></div><div id="items" class="items"></div></div>
<div id="closeup" class="closeup"><h3 id="closeTitle">摸摸 Lumi</h3><p id="closeHint">用手指在貓咪身上來回滑動</p><canvas id="close"></canvas><button id="back" class="back">回房間</button><div id="fx" class="fx"></div></div>
<div id="start" class="start"><div><h2>Lumi & Hoya Pixel Room</h2><p>像素房間、自由走動、睡覺、拖食物、逗貓棒，以及真正用手指摸貓。第一次點擊後才能啟用 iPhone 網頁音效。</p><button id="startBtn">開始遊戲</button></div></div>
</div>
<div class="tools"><button id="call" class="tool"><b>🐾</b><span>叫過來摸</span></button><button id="food" class="tool"><b>🥣</b><span>食物</span></button><button id="toy" class="tool"><b>🪶</b><span>逗貓</span></button><button id="state" class="tool"><b>🌙</b><span>看看狀態</span></button></div>
</div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),roomC=$('room'),ctx=roomC.getContext('2d'),closeC=$('close'),cctx=closeC.getContext('2d'),scene=$('scene');
const defs={lumi:{name:'Lumi',sub:'重點色布偶貓 · 溫柔黏人',letter:'L',body:'#eadfcb',point:'#6d554c',face:'#f1e6d6',eye:'#76bfe7',speed:31,sleep:.95},hoya:{name:'Hoya',sub:'金漸層英短 · 活潑好奇',letter:'H',body:'#e6b56f',point:'#a86f3e',face:'#f3d69e',eye:'#263240',speed:42,sleep:.82}};
const fresh=()=>({current:'lumi',coins:150,music:true,cats:{lumi:{hunger:82,mood:88,energy:76,bond:40,state:'wander',x:.38,y:.66,tx:.62,ty:.67,anger:0,interrupts:0},hoya:{hunger:78,mood:92,energy:84,bond:32,state:'wander',x:.64,y:.66,tx:.4,ty:.68,anger:0,interrupts:0}}});let S=fresh();try{const x=JSON.parse(localStorage.getItem('lhv3'));if(x&&x.cats)S=Object.assign(fresh(),x)}catch(e){}
let W=0,H=0,dpr=Math.min(devicePixelRatio||1,2),last=performance.now(),idle=1,closeMode=false,foodDrop=null,toyObj=null,drag=null,noteTimer=null,petDist=0,petLast=null,audio=null,bgm=null,bgmStep=0,acc=0;
const cat=()=>S.cats[S.current],def=()=>defs[S.current],clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));function save(){try{localStorage.setItem('lhv3',JSON.stringify(S))}catch(e){}}function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1200)}function note(t,ms=1700){const e=$('note');e.textContent=t;e.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>e.classList.remove('show'),ms)}function vib(ms=18){if(navigator.vibrate)navigator.vibrate(ms)}
function audioOn(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();if(S.music)startBgm()}catch(e){}}function tone(f,d=.08,type='square',v=.02,delay=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=.0001;o.connect(g);g.connect(audio.destination);const t=audio.currentTime+delay;g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}function sfx(k){if(k==='meow'){tone(520,.09,'triangle',.025);tone(410,.12,'triangle',.02,.08)}if(k==='purr'){tone(95,.09,'sine',.016);tone(112,.08,'sine',.011,.07)}if(k==='angry'){tone(150,.16,'sawtooth',.03);tone(105,.18,'sawtooth',.022,.07)}if(k==='eat'){tone(270,.05,'square',.014);tone(335,.05,'square',.01,.05)}if(k==='coin'){tone(880,.07,'square',.025);tone(1320,.09,'square',.02,.06)}}function startBgm(){stopBgm();if(!audio||!S.music)return;const seq=[262,330,392,330,294,349,440,349];bgm=setInterval(()=>{if(!closeMode&&S.music)tone(seq[bgmStep++%seq.length],.16,'triangle',.007)},430)}function stopBgm(){if(bgm){clearInterval(bgm);bgm=null}}
function resize(){const r=scene.getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(470,r.height);roomC.width=Math.round(W*dpr);roomC.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const z=Math.min(W*.92,450);closeC.width=Math.round(z*dpr);closeC.height=Math.round(z*dpr);cctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function roomBg(){const hr=new Date().getHours(),night=hr>=22||hr<7;rect(ctx,0,0,W,H,night?'#34303b':'#b8875d');rect(ctx,0,0,W,H*.57,night?'#26293a':'#d8c6a8');rect(ctx,W*.08,H*.1,W*.28,H*.22,'#6b513f');rect(ctx,W*.095,H*.115,W*.25,H*.19,night?'#18223b':'#8ecbe0');if(night){ctx.fillStyle='#f5e49a';ctx.beginPath();ctx.arc(W*.17,H*.16,11,0,7);ctx.fill()}rect(ctx,W*.22,H*.68,W*.56,H*.14,'#855f6f');rect(ctx,W*.25,H*.70,W*.50,H*.10,'#b98798');rect(ctx,W*.78,H*.37,12,H*.31,'#745846');rect(ctx,W*.70,H*.39,W*.22,11,'#94715a');rect(ctx,W*.72,H*.53,W*.18,10,'#94715a');rect(ctx,W*.07,H*.68,W*.19,H*.10,'#493f55');rect(ctx,W*.085,H*.69,W*.16,H*.07,'#766781');rect(ctx,W*.80,H*.74,34,9,'#658392');rect(ctx,W*.805,H*.735,24,8,'#94b2bd')}
function drawCat(g,x,y,s,c,state){const d=def(),body=d.body,point=d.point,face=d.face,eye=d.eye;g.save();g.translate(Math.round(x),Math.round(y));g.fillStyle='#0004';g.beginPath();g.ellipse(0,s*14,s*18,s*6,0,0,7);g.fill();let bob=state==='walk'?Math.sin(performance.now()/90)*s*.8:state==='sleep'?Math.sin(performance.now()/650)*s*.25:0;g.translate(0,bob);g.scale(c.facing||1,1);rect(g,s*12,-s*1,s*8,s*4,point);rect(g,s*18,-s*8,s*4,s*10,point);rect(g,-s*10,-s*8,s*24,s*20,body);rect(g,-s*8,-s*1,s*5,s*15,point);rect(g,s*7,-s*1,s*5,s*15,point);rect(g,-s*13,-s*22,s*25,s*18,body);rect(g,-s*12,-s*27,s*7,s*7,point);rect(g,s*5,-s*27,s*7,s*7,point);rect(g,-s*8,-s*18,s*16,s*11,S.current==='lumi'?point:face);if(S.current==='lumi')rect(g,-s*5,-s*14,s*10,s*7,face);if(state==='sleep'){rect(g,-s*5,-s*13,s*4,s*1,'#322724');rect(g,s*2,-s*13,s*4,s*1,'#322724')}else if(state==='angry'){rect(g,-s*6,-s*14,s*5,s*2,'#2b2321');rect(g,s*2,-s*14,s*5,s*2,'#2b2321')}else{rect(g,-s*6,-s*15,s*4,s*4,eye);rect(g,s*2,-s*15,s*4,s*4,eye);rect(g,-s*5,-s*14,s,s,'#fff');rect(g,s*3,-s*14,s,s,'#fff')}rect(g,-s,-s*10,s*3,s*2,'#d47f7f');if(state==='sleep'){g.fillStyle='#ebe4ff';g.font=`${Math.max(10,s*6)}px monospace`;g.fillText('Z',s*14,-s*24)}if(c.anger>40||state==='angry'){g.fillStyle='#ff8178';g.font=`${Math.max(10,s*6)}px monospace`;g.fillText('!',-s*23,-s*23)}g.restore()}
function behavior(dt){const c=cat(),d=def(),hr=new Date().getHours(),night=hr>=23||hr<7;c.hunger=clamp(c.hunger-dt*.18);if(c.state==='sleep')c.energy=clamp(c.energy+dt*1.7);else c.energy=clamp(c.energy-dt*(night?.17:.10));c.anger=clamp(c.anger-dt*1.5);acc+=dt;if(acc>7){acc=0;hud();save()}if(closeMode||drag)return;const px=c.x*W,py=c.y*H,tx=c.tx*W,ty=c.ty*H,dx=tx-px,dy=ty-py,dist=Math.hypot(dx,dy);if(c.state==='wander'||c.state==='walk'){c.state='walk';if(dist>4){c.x+=dx/dist*d.speed*dt/W;c.y+=dy/dist*d.speed*dt/H;c.facing=dx>=0?1:-1}else{if(c.goSleep){c.goSleep=false;c.state='sleep';c.interrupts=0;note(`${d.name} 窩進小床睡著了…`)}else{c.state='idle';idle=1.2+Math.random()*2.5}}}else if(c.state==='idle'){idle-=dt;if(idle<=0){const sleepy=c.energy<28||(night&&Math.random()<.5*d.sleep);if(sleepy){c.tx=.16;c.ty=.73;c.goSleep=true;c.state='walk'}else{c.tx=.2+Math.random()*.6;c.ty=.62+Math.random()*.13;c.state='walk'}}}if(foodDrop){const dd=Math.hypot(px-foodDrop.x,py-foodDrop.y);if(dd>22){c.state='walk';c.tx=foodDrop.x/W;c.ty=foodDrop.y/H}else{c.state='eat';foodDrop.t-=dt;if(Math.random()<dt*4)sfx('eat');if(foodDrop.t<=0){c.hunger=clamp(c.hunger+foodDrop.val);c.mood=clamp(c.mood+4);c.bond=clamp(c.bond+1);foodDrop=null;c.state='idle';idle=1;note(`${d.name} 吃得很滿意 😋`);sfx('coin');hud();save()}}}if(toyObj&&toyObj.active){const dd=Math.hypot(px-toyObj.x,py-toyObj.y);if(dd>28){c.state='walk';c.tx=toyObj.x/W;c.ty=toyObj.y/H}else{c.state='play';c.mood=clamp(c.mood+dt*1.3);c.energy=clamp(c.energy-dt*.7);c.bond=clamp(c.bond+dt*.18)}}}
function draw(){roomBg();if(foodDrop){ctx.font='26px serif';ctx.fillText(foodDrop.e,foodDrop.x-12,foodDrop.y+7)}if(toyObj&&toyObj.active){ctx.strokeStyle='#d9bca0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(toyObj.x,toyObj.y);ctx.lineTo(toyObj.x+24,toyObj.y-34);ctx.stroke();ctx.font='25px serif';ctx.fillText('🪶',toyObj.x-12,toyObj.y+7)}const c=cat();drawCat(ctx,c.x*W,c.y*H,3.4,c,c.state==='play'?'walk':c.state)}function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;behavior(dt);draw();requestAnimationFrame(loop)}
function hud(){const c=cat(),d=def();$('name').textContent=d.name;$('sub').textContent=d.sub;$('badge').textContent=d.letter;$('badge').style.background=S.current==='lumi'?'#6d554c':'#b27a43';$('coins').textContent=Math.round(S.coins);[['h',c.hunger],['m',c.mood],['e',c.energy],['b',c.bond]].forEach(([k,v])=>{$(k+'t').textContent=Math.round(v);$(k+'b').style.width=clamp(v)+'%'});$('music').textContent=S.music?'♫':'×'}
function callCat(){audioOn();const c=cat(),d=def();if(c.state==='sleep'){c.interrupts++;c.anger=clamp(c.anger+18);if(c.interrupts===1){note(`${d.name} 耳朵動了一下…還在睡`);sfx('meow')}else if(c.interrupts===2){c.state='angry';note(`${d.name}：不要吵我啦 😾`);sfx('angry');vib(35)}else{c.state='angry';c.mood=clamp(c.mood-5);c.bond=clamp(c.bond-1);note(`${d.name} 生氣了，暫時不想理你`);sfx('angry');vib(50)}hud();save();return}if(c.anger>35){note(`${d.name} 現在不太想被摸…`);sfx('angry');return}c.state='walk';c.tx=.5;c.ty=.82;note(`${d.name} 聽到你叫，走過來了…`);const ck=setInterval(()=>{if(Math.hypot(c.x*W-W*.5,c.y*H-H*.82)<15){clearInterval(ck);openClose()}},100);setTimeout(()=>clearInterval(ck),5000)}function openClose(){closeMode=true;stopBgm();$('closeup').classList.add('show');$('closeTitle').textContent='摸摸 '+def().name;$('closeHint').textContent='直接用手指在貓咪身上來回滑動';petDist=0;petLast=null;drawClose()}function closeClose(){closeMode=false;$('closeup').classList.remove('show');const c=cat();c.state='idle';idle=1.2;if(S.music)startBgm();save()}
function drawClose(){if(!closeMode)return;const z=closeC.clientWidth;cctx.clearRect(0,0,z,z);rect(cctx,0,0,z,z,'#24202c');rect(cctx,0,z*.68,z,z*.32,'#6f607c');drawCat(cctx,z*.5,z*.63,10,cat(),cat().anger>35?'angry':'idle');requestAnimationFrame(drawClose)}function heart(x,y){const h=document.createElement('div');h.className='heart';h.textContent=Math.random()>.5?'💗':'✨';h.style.left=(x-10)+'px';h.style.top=(y-10)+'px';$('fx').appendChild(h);setTimeout(()=>h.remove(),1000)}function closePointer(e){const r=closeC.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(e.type==='pointerdown'){audioOn();petLast={x,y};closeC.setPointerCapture?.(e.pointerId);return}if(e.type==='pointerup'||e.type==='pointercancel'){petLast=null;return}if(e.type==='pointermove'&&petLast){const d=Math.hypot(x-petLast.x,y-petLast.y);if(d>12){petDist+=d;petLast={x,y};const c=cat();c.mood=clamp(c.mood+.16);c.bond=clamp(c.bond+.06);if(petDist>50){petDist=0;heart(x,y);sfx('purr');vib(12);$('closeHint').textContent=Math.random()>.45?'呼嚕嚕…很舒服':'再摸一下嘛 ♡'}hud()}}}['pointerdown','pointermove','pointerup','pointercancel'].forEach(ev=>closeC.addEventListener(ev,closePointer));
roomC.addEventListener('pointerdown',e=>{if(closeMode||drag)return;audioOn();const r=roomC.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,c=cat();if(Math.hypot(x-c.x*W,y-c.y*H)<50)callCat()});
function openDrawer(kind){$('items').innerHTML='';$('drawer').classList.add('show');if(kind==='food'){ $('drawerTitle').textContent='拖曳食物到房間地板';[['🥣','飼料',20],['🥫','罐罐',30],['🐟','小魚',18]].forEach(v=>mk('food',v))}else{$('drawerTitle').textContent='拖曳逗貓棒到房間';mk('toy',['🪶','逗貓棒',0])}}function mk(type,a){const e=document.createElement('div');e.className='item';e.dataset.type=type;e.dataset.e=a[0];e.dataset.v=a[2];e.innerHTML=`<div><b>${a[0]}</b><small>${a[1]}</small></div>`;e.addEventListener('pointerdown',startDrag);$('items').appendChild(e)}function startDrag(e){audioOn();e.preventDefault();drag={type:e.currentTarget.dataset.type,e:e.currentTarget.dataset.e,v:+e.currentTarget.dataset.v};document.addEventListener('pointermove',dragMove,{passive:false});document.addEventListener('pointerup',dragEnd,{passive:false});note(drag.type==='food'?'拖到地板放下':'在房間裡移動羽毛')}function dragMove(e){if(!drag)return;e.preventDefault();if(drag.type==='toy'){const r=roomC.getBoundingClientRect();toyObj={active:true,x:clamp(e.clientX-r.left,20,W-20),y:clamp(e.clientY-r.top,80,H-35)}}}function dragEnd(e){if(!drag)return;e.preventDefault();const r=roomC.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(drag.type==='food'&&x>=0&&x<=W&&y>=H*.55&&y<=H){if(S.coins<10)toast('金幣不夠');else{S.coins-=10;foodDrop={x:clamp(x,25,W-25),y:clamp(y,H*.6,H-30),e:drag.e,val:drag.v,t:2.2};cat().state='walk';note(`${def().name} 看到食物了！`);hud();save()}}if(drag.type==='toy'){setTimeout(()=>{if(toyObj)toyObj.active=false;toyObj=null;cat().state='idle';idle=1},650)}drag=null;$('drawer').classList.remove('show');document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd)}
$('call').onclick=callCat;$('food').onclick=()=>openDrawer('food');$('toy').onclick=()=>openDrawer('toy');$('closeDrawer').onclick=()=>$('drawer').classList.remove('show');$('back').onclick=closeClose;$('switch').onclick=()=>{if(closeMode)closeClose();S.current=S.current==='lumi'?'hoya':'lumi';hud();note(`換 ${def().name} 出來玩`);sfx('meow');save()};$('music').onclick=()=>{audioOn();S.music=!S.music;if(S.music)startBgm();else stopBgm();hud();save()};$('state').onclick=()=>{const c=cat(),hr=new Date().getHours(),desc=c.state==='sleep'?'正在睡覺 💤':c.anger>35?'現在有點生氣 😾':c.energy<30?'已經很想睡了':'精神還不錯';note(`${def().name}：${desc} · 現在 ${String(hr).padStart(2,'0')} 點`,2200)};$('startBtn').onclick=()=>{audioOn();$('start').style.display='none';sfx('meow');note('點貓或「叫過來摸」試試看')};resize();hud();requestAnimationFrame(loop);
})();
