<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4edde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lumi & Hoya · 小日子</title>
  <link rel="stylesheet" href="style.css?v=0.1.40">
  <link rel="stylesheet" href="polaroid.css?v=0.1.41">
</head>
<body>
<input id="ios-haptic" type="checkbox" switch tabindex="-1" aria-hidden="true" style="position:fixed;left:-20px;top:-20px;width:1px;height:1px;opacity:.001;pointer-events:none">
<audio id="bgm-media" src="bgm.wav?v=v0.1.16" preload="auto" loop playsinline></audio>
<audio id="danger-bgm-media" src="danger_bgm_v2.wav?v=20260914u2" preload="auto" loop playsinline></audio>
<main class="game">
  <header><div class="brand"><span class="mark">LH</span><div><h1>Lumi & Hoya</h1><p>小日子 · a little room for two</p></div></div><div class="top-actions"><button id="care-score" aria-expanded="false"><span>🐾</span> <b id="care-value">0</b><small>/100</small><span id="care-delta"></span></button><div id="care-breakdown" hidden><span>Lumi <b id="care-lumi">0</b>/100</span><span>Hoya <b id="care-hoya">0</b>/100</span><span>潔淨 <b id="care-home">0</b>/30</span></div><button id="music" aria-label="開啟全部聲音" aria-pressed="false">♫<span class="sound-dot"></span></button></div></header>
  <section class="dashboard" aria-label="貓咪狀態">
    <div class="cat-tabs" role="group" aria-label="選擇貓咪"><button data-cat="lumi" aria-pressed="true"><i class="cat-dot lumi"></i>Lumi</button><button data-cat="hoya" aria-pressed="false"><i class="cat-dot hoya"></i>Hoya</button><button id="photo-open" class="photo-open" aria-label="今日剩餘 2 次拍攝"><span>📷 今日寫真</span><small id="photo-quota">今日剩餘：2 次</small></button><button id="reward-open" class="wallet" aria-label="開啟金幣獎勵選單" aria-expanded="false" aria-controls="reward-panel"><span class="coin-icon" aria-hidden="true"></span> <b id="coins">150</b></button></div>
    <div id="reward-panel" hidden aria-label="獎勵商品"><p>拖曳以金幣購買小禮物給 Lumi & Hoya</p><div><button data-reward="fish"><i>🐟</i><span>小魚乾<small>15 Coins · 3 秒</small></span></button><button data-reward="can"><i>🥫</i><span>高級罐頭<small>30 Coins · 6 秒</small></span></button><button data-reward="catnip"><i>🌿</i><span>貓薄荷零食<small>50 Coins · 10 秒</small></span></button><button data-reward="silvervine"><i>🍃</i><span>木天蓼<small>50 Coins · 10 秒</small></span></button><button data-reward="fishOil"><i>💧</i><span>貓魚油<small>40 Coins · 6 秒</small></span></button><button data-reward="freezeDried"><i>🍖</i><span>貓凍乾<small>20 Coins · 3 秒</small></span></button><button data-reward="dental"><i>🦷</i><span>貓潔牙餅<small>30 Coins · 5 秒</small></span></button><button id="seasonal-bed-buy"><i id="seasonal-bed-icon">❄️</i><span id="seasonal-bed-name">夏日雙貓涼墊<small id="seasonal-bed-status">100 Coins · 7 天</small></span></button></div></div>
    <div id="painting-panel" hidden aria-label="選擇牆上照片"><p>選一幅牆上像素畫 · 更換 5 Coins</p><div></div></div>
    <div class="meters"><label><span>飽足 <b id="hunger-points"></b></span><meter id="hunger" min="0" max="20"></meter></label><label><span>心情 <b id="mood-points"></b></span><meter id="mood" min="0" max="20"></meter></label><label><span>精力 <b id="energy-points"></b></span><meter id="energy" min="0" max="20"></meter></label><label><span>親密 <b id="bond-points"></b></span><meter id="bond" min="0" max="10"></meter></label><label><span>潔淨 <b id="cleanliness-points"></b></span><meter id="cleanliness" min="0" max="30"></meter></label></div>
  </section>
  <section id="scene" aria-label="貓咪的房間">
    <canvas id="room" width="320" height="320" aria-label="Lumi 和 Hoya 的像素房間；點貓靠近，滑動摸摸，拖食物或羽毛到地板"></canvas>
    <div class="room-label"><span id="time-label">午後的小房間</span><span id="clock"></span></div>
    <p id="note" role="status" aria-live="polite"></p>
    <p id="storm-prompt" hidden>☔ 點窗簾拉上，貓咪才敢出來</p>
    <button id="back" hidden>← 回到房間</button>
    <div id="intro"><span class="eyebrow">WELCOME HOME</span><h2>今天，也一起慢慢過。</h2><p>兩隻貓，一個有你的午後。<br>窗邊每天一束小花，點一下看看。</p><button id="start">推開小門 <span>→</span></button><small>戴上耳機，聽聽牠們的小聲呼嚕</small><small id="app-version"></small></div>
  </section>
  <footer><div id="knowledge-ticker" class="knowledge-ticker" hidden><button id="knowledge-open" aria-expanded="false"><span id="knowledge-text"></span></button><button id="knowledge-dismiss">今天不再顯示</button></div><p id="hint">點點貓咪，等牠走到你身邊</p><nav aria-label="互動工具"><button id="water"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M16 2C13 8 7 13 7 18a9 9 0 0 0 18 0C25 13 19 8 16 2"/><path class="line" d="M11 19q1 4 5 4"/></svg><span>補水</span></button><button id="food"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M3 13q13-5 26 0l-5 12H8z"/><path d="M4 12q12-7 24 0v4q-12 5-24 0z" fill="#c5c3a2"/><path class="line" d="M8 15q8 3 16 0M10 25h12"/></svg><span>拖曳餵食</span></button><button id="toy"><svg viewBox="0 0 32 28" aria-hidden="true"><path class="line" d="M6 25L23 3M22 5q-13-5-11 10"/><path d="M12 11q-10 0-7 10q10 1 7-10"/></svg><span>拖曳逗貓</span></button><button id="scoop"><svg viewBox="0 0 32 28" aria-hidden="true"><path class="line" d="M24 4 17 15"/><path d="M22 1l5 3-3 5-5-3zM5 17l11-4 7 5-4 8-10 1-5-5z"/><path class="line" d="m8 19 3 3m2-5 3 4m2-5 2 3"/></svg><span>拖曳鏟沙</span></button><button id="night" aria-pressed="false"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M21 3C4 0 1 23 18 25q10 0 12-9C17 22 12 9 21 3"/></svg><span>晚安燈</span></button></nav></footer>
</main>
<div id="photo-modal" class="photo-modal" hidden role="dialog" aria-modal="true" aria-labelledby="photo-heading"><section class="photo-modal__panel"><button id="photo-close" class="photo-modal__close" aria-label="關閉拍立得">×</button><h2 id="photo-heading">今日寫真</h2><p class="photo-modal__copy"></p><div class="photo-modal__body"></div><div class="photo-modal__actions"><button id="photo-shutter">按下快門</button><button id="photo-album">看看相簿</button></div></section></div><div id="photo-flash" class="photo-flash" aria-hidden="true"></div>
<script src="engine.js?v=0.1.41"></script><script src="knowledge.js?v=0.1.27"></script><script src="wonders.js?v=0.1.41"></script><script src="polaroid.js?v=0.1.41"></script><script src="game.js?v=0.1.41"></script>
</body>
</html>
