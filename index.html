<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7ed">
<title>Lumi & Hoya</title>
<style>
:root{--bg:#fff8ef;--card:#fffdf9;--ink:#453733;--muted:#8b7770;--border:#ecdccf;--lumi:#9f8ab8;--hoya:#df976c;--gold:#edae32;--green:#55b994;--pink:#eb83a7;--blue:#61b6d8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:520px;margin:auto;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(#fffaf4,#fff5e8)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fffdf9ee;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.who{display:flex;align-items:center;gap:10px;min-width:0}.badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;color:white;background:var(--lumi)}
.name{font-size:21px;font-weight:900;line-height:1.05}.breed{font-size:12px;color:var(--muted);margin-top:3px}.head-right{display:flex;align-items:center;gap:8px}.coins{padding:8px 11px;background:#fff0c5;border-radius:999px;font-weight:900;font-size:13px}.switch{border:0;background:var(--gold);color:#fff;padding:10px 13px;border-radius:14px;font-weight:900}
main{padding:14px 14px 8px;flex:1;display:flex;flex-direction:column}.stats{background:#fffdf9;border:1px solid var(--border);border-radius:20px;padding:12px 14px}.stat{margin:8px 0}.statline{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:5px}.track{height:9px;background:#e7dfd7;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;transition:width .28s ease}#bh{background:var(--green)}#bp{background:var(--pink)}#bc{background:var(--blue)}
.scene{position:relative;margin-top:12px;min-height:420px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.pet-card{width:min(94%,420px);aspect-ratio:1/1.02;border-radius:28px;overflow:hidden;background:#fff;border:1px solid var(--border);box-shadow:0 10px 30px #5f3e2020;position:relative}
.pet-card img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s ease,transform .22s ease}.pet-card.pop img{transform:scale(1.045)}.pet-card.jump{animation:jump .55s ease}.pet-card.wiggle{animation:wiggle .45s ease}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.bubble{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#ffffffea;border:1px solid var(--border);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:900}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;font-size:24px;animation:heart 1.05s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translateY(15px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.25)}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.action{border:1px solid var(--border);background:#fffdf9;border-radius:16px;min-height:62px;padding:7px 2px;font-weight:850;color:var(--ink)}.action:active{transform:scale(.97)}.ico{font-size:23px;display:block}.lbl{font-size:11px;display:block;margin-top:3px}
.utility{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.utility button{border:0;border-radius:14px;padding:11px;font-weight:850;background:#efe8e2;color:var(--ink)}.utility .game{background:#6f5f82;color:white}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#342b27;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.sheet{width:min(92vw,390px);background:#fffdf9;border-radius:24px;padding:18px}.sheet h2{margin:0 0 5px}.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}.arena{height:260px;border:2px dashed #e8c590;border-radius:18px;background:#fff8e9;position:relative;overflow:hidden}.target{position:absolute;font-size:46px;display:none;user-select:none}.prompt{height:100%;display:grid;place-items:center;text-align:center;font-weight:900;color:#9a6220;padding:20px}.sheet-actions{display:flex;gap:8px;margin-top:10px}.sheet-actions button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:900}.start{background:var(--gold);color:white}.close{background:#ece6e1;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="who"><div id="badge" class="badge">L</div><div><div id="name" class="name">Lumi</div><div id="breed" class="breed">重點色布偶貓・溫柔黏人</div></div></div>
  <div class="head-right"><div class="coins">💰 <span id="coins">150</span></div><button id="switch" class="switch" type="button">切換</button></div>
</header>
<main>
  <section class="stats">
    <div class="stat"><div class="statline"><span>🐟 飽足感</span><span id="th">80%</span></div><div class="track"><div id="bh" class="bar"></div></div></div>
    <div class="stat"><div class="statline"><span>💖 心情</span><span id="tp">85%</span></div><div class="track"><div id="bp" class="bar"></div></div></div>
    <div class="stat"><div class="statline"><span>✨ 清潔度</span><span id="tc">90%</span></div><div class="track"><div id="bc" class="bar"></div></div></div>
  </section>
  <section class="scene">
    <div id="petCard" class="pet-card"><img id="petImg" alt="Lumi 遊戲角色"><div id="fx" class="fx"></div><div id="bubble" class="bubble">喵～今天也要陪我喔！</div></div>
    <div class="actions">
      <button id="pet" class="action" type="button"><span class="ico">🤍</span><span class="lbl">摸摸</span></button>
      <button id="feed" class="action" type="button"><span class="ico">🥣</span><span class="lbl">餵食</span></button>
      <button id="play" class="action" type="button"><span class="ico">🧶</span><span class="lbl">玩耍</span></button>
      <button id="brush" class="action" type="button"><span class="ico">🪮</span><span class="lbl">梳毛</span></button>
    </div>
    <div class="utility"><button id="shop" type="button">🛒 買高級罐罐</button><button id="game" class="game" type="button">🎮 接肉泥</button></div>
  </section>
</main>
</div>
<div id="modal" class="modal" aria-hidden="true"><div class="sheet"><h2>🎮 接肉泥大作戰</h2><p>10 秒內一直點肉泥，接到一個 +10 金幣。</p><div id="arena" class="arena"><div id="target" class="target">🥫</div><div id="prompt" class="prompt">按「開始」後肉泥會到處跑！</div></div><div class="sheet-actions"><button id="start" class="start" type="button">開始</button><button id="close" class="close" type="button">關閉</button></div></div></div>
<div id="toast" class="toast"></div>

function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1100)}
function setBubble(t){$("bubble").textContent=t}
function render(){const c=cats[key];$("name").textContent=c.name;$("breed").textContent=c.breed;$("badge").textContent=c.badge;$("badge").style.background=c.color;$("coins").textContent=coins;$("th").textContent=c.hunger+"%";$("tp").textContent=c.happy+"%";$("tc").textContent=c.clean+"%";$("bh").style.width=c.hunger+"%";$("bp").style.width=c.happy+"%";$("bc").style.width=c.clean+"%";$("petImg").src=c.idle;$("petImg").alt=c.name+" 遊戲角色";save()}
function showPose(pose,msg,anim="pop",ms=1500){clearTimeout(actionTimer);const c=cats[key],card=$("petCard");$("petImg").src=c[pose];setBubble(msg);card.classList.remove("pop","jump","wiggle");void card.offsetWidth;card.classList.add(anim);actionTimer=setTimeout(()=>{card.classList.remove(anim);$("petImg").src=c.idle;setBubble("喵～今天也要陪我喔！")},ms)}
function hearts(){const fx=$("fx");for(let i=0;i<5;i++){const h=document.createElement("div");h.className="heart";h.textContent=i%2?"💗":"💕";h.style.left=(25+Math.random()*50)+"%";h.style.bottom=(12+Math.random()*18)+"%";h.style.animationDelay=(i*.08)+"s";fx.appendChild(h);setTimeout(()=>h.remove(),1300)}}
$("switch").addEventListener("click",()=>{clearTimeout(actionTimer);key=key==="lumi"?"hoya":"lumi";render();setBubble("換我囉！我是 "+cats[key].name);$("petCard").classList.add("wiggle");setTimeout(()=>$("petCard").classList.remove("wiggle"),450)});
$("pet").addEventListener("click",()=>{const c=cats[key];c.happy=clamp(c.happy+5);showPose("idle",c.lines[Math.floor(Math.random()*c.lines.length)],"wiggle",1000);hearts();render()});
$("feed").addEventListener("click",()=>{const c=cats[key];if(coins<10){toast("金幣不足，先去接肉泥！");return}coins-=10;c.hunger=clamp(c.hunger+25);c.happy=clamp(c.happy+3);render();showPose("feed","好吃！再來一碗 😋","pop",1700)});
$("play").addEventListener("click",()=>{const c=cats[key];c.happy=clamp(c.happy+18);c.hunger=clamp(c.hunger-7);render();showPose("play","抓到了！再丟一次！","jump",1500)});
$("brush").addEventListener("click",()=>{const c=cats[key];c.clean=clamp(c.clean+22);c.happy=clamp(c.happy+4);render();showPose("brush","嗯～這裡再梳一下","wiggle",1700);hearts()});
$("shop").addEventListener("click",()=>{if(coins<30){toast("需要 30 金幣");return}if(confirm("花 30 金幣買高級罐罐，兩隻一起吃？")){coins-=30;Object.values(cats).forEach(c=>{c.hunger=clamp(c.hunger+35);c.happy=clamp(c.happy+8)});render();showPose("feed","今天吃高級罐罐！😻","pop",1800)}});
function openGame(){$("modal").classList.add("show");$("modal").setAttribute("aria-hidden","false")}
function stopGame(){if(gameTimer)clearInterval(gameTimer);gameTimer=null;$("target").style.display="none"}
function closeGame(){stopGame();$("modal").classList.remove("show");$("modal").setAttribute("aria-hidden","true")}
function moveTarget(){const a=$("arena"),t=$("target"),mx=Math.max(5,a.clientWidth-t.offsetWidth-8),my=Math.max(5,a.clientHeight-t.offsetHeight-8);t.style.left=(4+Math.random()*mx)+"px";t.style.top=(4+Math.random()*my)+"px"}
function startGame(){stopGame();score=0;remain=10;$("target").style.display="block";$("prompt").textContent="快接！剩 10 秒";moveTarget();gameTimer=setInterval(()=>{remain--;$("prompt").textContent="快接！剩 "+remain+" 秒";moveTarget();if(remain<=0){stopGame();coins+=score*10;render();$("prompt").textContent="完成！接到 "+score+" 個，+"+(score*10)+" 金幣"}},1000)}
$("game").addEventListener("click",openGame);$("close").addEventListener("click",closeGame);$("start").addEventListener("click",startGame);
$("target").addEventListener("click",()=>{if(!gameTimer)return;score++;$("target").style.transform="scale(1.2)";setTimeout(()=>$("target").style.transform="scale(1)",80);moveTarget()});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeGame()});
load();render();
})();
</script>
</body>
</html>
